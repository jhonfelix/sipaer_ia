upstream nextjs {
    server frontend:3000;
}

server {
    listen 80;
    server_name ia.cenipa.intraer localhost;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/x-javascript;
    gzip_min_length 1024;

    # Arquivos de mídia (documentos, imagens, áudio) — servidos diretamente
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        autoindex off;
    }

    # Arquivos estáticos do Next.js — hash no nome, pode cachear 1 ano
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tudo mais vai pro Next.js (que internamente faz rewrite /api/* → backend)
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
