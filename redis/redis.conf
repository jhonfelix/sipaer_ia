# ── Rede ──────────────────────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode no
port 6379

# ── Memória ───────────────────────────────────────────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Persistência RDB ──────────────────────────────────────────────────────────
save 900 1
save 300 10
save 60 1000
dbfilename dump.rdb
dir /data

# ── Persistência AOF ──────────────────────────────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── Performance ───────────────────────────────────────────────────────────────
tcp-backlog 511
tcp-keepalive 300
hz 10
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

# ── Logs ──────────────────────────────────────────────────────────────────────
loglevel notice
